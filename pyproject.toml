[project]
name = "flow2api-mcp"
version = "1.0.0"
description = "MCP Server for Flow2API - AI image and video generation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Flow2API Team" }
]
keywords = ["mcp", "ai", "image-generation", "video-generation", "flow2api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/yourname/flow2api-mcp"
Repository = "https://github.com/yourname/flow2api-mcp"

[project.scripts]
flow2api-mcp = "mcp_server.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
